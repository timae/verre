name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Since Next 16, `next build` no longer runs ESLint, so this is the only
      # lint gate (on Next 15 the Deplo.io build was). It also enforces the
      # import allowlists on proxy.ts / auth.config.ts / instrumentation.ts
      # (eslint.config.mjs), which replace the build-time Edge-bundle failure
      # that used to catch Prisma / bcrypt / the full auth.ts reaching the proxy.
      # Errors fail; warnings are an accepted baseline (no --max-warnings).
      - name: ESLint
        run: npm run lint

      # Pins the allowlists themselves: a weakened selector would still lint the
      # real files clean, so mutation cases are checked against the real config.
      - name: Lint-boundary pins
        run: node scripts/tests/lint-boundary-units.mjs

      # No em dash in user-facing copy (root CLAUDE.md § Coding style). ESLint
      # above covers app/, components/ and packages/core/src; apps/mobile has no
      # ESLint config, so this TS-AST twin covers it (same exemptions, own pins).
      - name: No em dash in mobile copy
        run: node scripts/check-no-em-dash-copy.mjs

      # Post-read census (You profile step 4): every read of feed_items /
      # feed_item_likes / feed_item_tags in app/ + lib/ sits in an allow-listed
      # file with a pinned count, so a new read path (a possible post leak past
      # Check-Ins Visible To) needs a reviewed pin change. Blind spots in the
      # script header.
      - name: Post-read census
        run: node scripts/check-post-reads.mjs

      # Moment-name census (Moment Visibility step 3b, T9): every read of a
      # moment's name on the server (app/, lib/, root files, components/ that
      # import lib/prisma; the patterns in the script header: SQL s.name /
      # sessions.name / host_name, Prisma hostName: true, session find /
      # update, the relations to Session) sits in a listed file with a pinned
      # count and its reason, so a new read (a possible leak of a name past
      # "only to a viewer who could open it") needs a reviewed pin change. Own
      # negative control first; blind spots in the script header.
      - name: Moment-name census
        run: node scripts/check-moment-names.mjs

      # Membership-write census (Moment Defaults K1 / K2): every write of a
      # session_members row in app/ + lib/ is listed as ENTRY (participation
      # may start there: seedParticipation follows it in the same function) or
      # NOT ENTRY with its reason (set-role, kick-keep: must not seed). Own
      # negative control first; blind spots in the script header.
      - name: Membership-write census
        run: node scripts/check-member-writes.mjs
