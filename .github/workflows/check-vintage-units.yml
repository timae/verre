name: Vintage text pins

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: vintage-units-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The suites import lib/catalogWrite.ts → lib/prisma.ts → @prisma/client.
      # Prisma 7's client no longer generates itself on install, and this
      # repo's postinstall only runs patch-package.
      - name: Generate the Prisma client
        run: npx prisma generate

      # Pure-unit pins for the free-text vintage field shared by every wine
      # input on web + native (@verre/core vintageText.ts). No DB/Redis/network.
      #
      # These guard a DATA-LOSS class, not a cosmetic one: the per-keystroke
      # digit strip these replaced made "NV" untypeable on the mobile clients,
      # and on an existing non-vintage check-in the first text change blanked
      # the vintage, which saving then persisted. The pins fail against the
      # bare \D strip, against substring
      # token matching ("NV Selection" is a wine name), and against collapsing
      # the typing filter into the boundary normalizer (which makes NV
      # unreachable again), and against laundering a signed year (-2019 → 2019).
      # Every mutation listed here was verified to fail the suite.
      - name: Vintage free-text pins
        run: npx tsx scripts/tests/vintage-text-units.ts

      # The suite above pins the HELPER's behaviour; it cannot see whether the
      # surfaces call it. Reintroducing `replace(/\D/g,'')` in one mobile
      # component would leave every pin green while restoring the original bug.
      # This gate pins the WIRING: no digit-strip / number-pad on a vintage
      # field, and every client submit + server persistence boundary routes
      # through the shared normalizer, and each required call site is asserted
      # as an ASSIGNMENT (a helper whose result is discarded is caught). Every
      # mutation in this class was verified to fail the gate.
      # Behavioural pins for the two extracted PRODUCTION helpers: the session
      # add-vs-edit payload builder and the scanner's untrusted-JSON coercion.
      # Both were previously "covered" by a gate that only checked a helper
      # existed, or by a test of a COPY of the logic — review proved both hollow.
      - name: Impression payload + scanner coercion pins
        run: npx tsx scripts/tests/impression-payload-units.ts

      # The app's in-moment block look (apps/mobile/src/lib/blockLook.ts) is
      # the web's locked matrix: someone who blocked you reads as a guest,
      # someone you blocked carries "Blocked" (docs/dev/block.md). Every matrix
      # cell, self and guest / deleted ids included. Pure, no DB.
      - name: Block look pins (app)
        run: npx tsx scripts/tests/block-look-units.ts

      # The app's username UI rules (usernames, UI half): where the profile
      # name sits with the @username line under it, the on-phone person search
      # (the server's search rules), what the Username field keeps, and Edit
      # Profile's limit line. Pure, no DB.
      - name: Username UI pins (app)
        run: npx tsx scripts/tests/username-ui-units.ts

      # Opening a post from a profile list: Impressions match by the rating id,
      # Cravings by the wine id; an absent id never matches a blind row.
      - name: List row → post row pins (app)
        run: npx tsx scripts/tests/list-post-units.ts

      # Moment Visibility step 2 (the app): the entry rule, the look-in link's
      # matcher on the RAW URL + its in-memory store (the token never in a
      # route), the details scheduler and its fetch gate (≤ 42 requests a
      # minute), the link opener's decision; Compare in a look-in (buildItems
      # unchanged without the new props, R4, the adapter, a bottle's stars).
      - name: Look-in pins (app)
        run: npx tsx scripts/tests/look-in-units.ts
      - name: Look-in Compare pins (app)
        run: npx tsx scripts/tests/look-in-compare-units.ts
      # Moment Visibility step 3 (the app): the privacy-write generation (a late
      # audience / link answer keeps the newer `me`), the own-post store over a
      # pinned detail, the impression page's `r…` address and the row → page
      # decision, the feed cache patch and stamp, the ⋯ rows' presence rule.
      - name: Post privacy pins (app)
        run: npx tsx scripts/tests/post-privacy-units.ts

      # The app's bottle picker rules (catalogue model change step 7, ADR-0009):
      # the client id, the year field + NV chip, the pick / create bodies, the
      # freeze rule's outcome, the details' alcohol and origin.
      - name: Bottle picker pins (app)
        run: npx tsx scripts/tests/catalog-choice-units.ts

      # The bottle picker's search controller (step 7b, ADR-0010): a request
      # GENERATION identifies the current search (A → B → A, a late answer, a
      # scope change), and "+ New Wine" only follows a successful answer for it.
      - name: Bottle search controller pins (app)
        run: npx tsx scripts/tests/bottle-search-units.ts

      # The "Add Wine to Catalogue" pages' handoff (2026-11-22): one key per
      # invocation, the result taken once, a dead flow refuses, the pop depth.
      - name: Catalogue pages handoff pins (app)
        run: npx tsx scripts/tests/picker-flow-units.ts

      # The app's rating auto-save (tasting-feedback build 1 § 1): the outbox
      # owner + runner and the impression draft (lib/rateOutboxCore.ts,
      # lib/impressionAutosaveCore.ts) against a fake /rate with the version
      # check: merge saves of the changed fields only, the base fixed at entry
      # creation and persisted, the answer table (canonical, unchanged, stale
      # 409 incl. its own lastOpId and the `rating: null` rule, 404 / 400 /
      # 401 / 429 / 503 / update_required / 409 wrongViewer), the viewer in
      # every body, the credential-owner check, the gate re-checked before a
      # send, waiters, Clear, the line-up overlay, sign-out, the 90-day
      # clean-up. No DB, no network. A runner loop shows up as a hang, so the
      # step is capped.
      - name: Rating auto-save pins (app)
        timeout-minutes: 5
        run: npx tsx scripts/tests/rate-outbox-units.ts

      # The server's post-COMMIT steps of a save (tasting-feedback build 1,
      # lib/afterCommit.ts) are coalesced per key: one run in flight plus one
      # trailing run with the latest function, keys independent, a failure
      # logged without stopping the trailing run. No DB, no Redis.
      - name: After-commit coalescing pins (server)
        run: npx tsx scripts/tests/after-commit-units.ts

      - name: Vintage surface wiring
        run: node scripts/check-vintage-wiring.mjs
