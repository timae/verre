name: Identity-store write chokepoint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: identity-writes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Fail the build if any code outside lib/identityStore.ts WRITES
      # users.password_hash or user_sessions.revokedAt. This enforces the
      # credential/revocation chokepoint (proposal §3, root CLAUDE.md) so the
      # Better Auth dual-store fan-out (step 5) has exactly one home and drift
      # between the two stores is impossible, not merely test-caught.
      #
      # No npm ci needed — the check is a dependency-free Node script that reads
      # tracked files via `git ls-files`.
      - name: Check credential/revocation writes go through identityStore
        run: node scripts/check-identity-writes.mjs

      # users.username has ONE writer, lib/username.ts, besides the web
      # register's insert (docs/dev/proposals/usernames.md § 8): the rename
      # quota, the taken / held answers and the READ COMMITTED rule live there.
      # A census: every write site the matchers find is compared with an
      # expected list, and the script runs its own negative control first (each
      # write idiom must be caught, each read idiom must pass).
      - name: Check username writes go through lib/username.ts
        run: node scripts/check-username-writes.mjs
