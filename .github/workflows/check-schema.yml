name: Schema vs migrations in sync

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a new commit lands on the same ref.
concurrency:
  group: schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Compare the committed migrations directory against schema.prisma.
      # `--exit-code` makes Prisma return 2 when they differ — meaning someone
      # changed the schema without running `prisma migrate dev` to generate
      # the matching migration file. Catches the failure mode where the app
      # runs fine locally (via `db push`) but breaks on Deploio because the
      # migration file is missing.
      #
      # `--from-migrations` requires a shadow database: Prisma applies the
      # migration SQL to it, reads the resulting schema, and diffs that
      # against schema.prisma.
      - name: Check schema and migrations are in sync
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgres://prisma:prisma@localhost:5432/shadow" \
            --exit-code

      # The diff above cannot see CHECK bodies, deferred constraint triggers,
      # partial uniqueness, NULLS NOT DISTINCT, audit immutability, or
      # concurrency behaviour — Prisma ignores objects it can't model. So a
      # regression that narrows the wine-catalog lead trigger, drops a NOT NULL,
      # or removes the last-admin guard would pass the drift check silently.
      # These suites apply the real migration chain and assert the invariants.
      #
      # A DEDICATED, DISPOSABLE database — deliberately NOT Prisma's `shadow`
      # DB, which Prisma treats as its own scratch space (it drops and recreates
      # objects there while computing diffs, so sharing it would let the two
      # stomp on each other).
      # Required: the suites import @prisma/client, and this repo's postinstall
      # only runs patch-package — it does NOT generate the client.
      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Create the integration-test database
        run: psql "postgres://prisma:prisma@localhost:5432/postgres" -c 'CREATE DATABASE catalog_test'
        env:
          PGPASSWORD: prisma

      - name: Apply the full migration chain
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test

      # The shapes of the five catalog tables are a VERSIONED IMPORT CONTRACT,
      # and CHECK PREDICATES ARE PART OF THAT SHAPE (RFC § Catalog write
      # ownership). `20260725220000` changed four of them from `btrim(x) <> ''`
      # to `catalog_fold_v1(x) <> ''` — strictly stronger, so rows that were
      # insertable stopped being insertable — with no surface and no version
      # bump, because neither side had tooling that would notice.
      #
      # 🔒 Runs BEFORE the row-writing suites: it reads schema only, so a
      # contract drift should fail fast rather than after several minutes of
      # integration tests.
      - name: Catalog contract CHECK constraints
        run: node scripts/check-catalog-contract-checks.mjs
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test

      # Needs `psql` on PATH: § 18 executes the prisma/CLAUDE.md bootstrap recipes
      # VERBATIM (they are documented as psql scripts with BEGIN;/COMMIT;, which
      # Prisma's executeRaw cannot accept). ubuntu-latest ships psql, and the
      # "Create the integration-test database" step above already relies on it.
      - name: Catalog schema invariants
        run: node scripts/tests/catalog-schema-integration.mjs
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test

      # Run via tsx: this suite imports lib/staffRole.ts so it exercises the
      # REAL revokeStaffRoleAs and its advisory lock. A raw `DELETE FROM
      # staff_roles` would test only the DB trigger and would report the
      # cross-path race as covered while never touching the app path.
      - name: Last-admin concurrency
        run: npx tsx scripts/tests/staff-role-concurrency.mjs
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test

      # Phase 2 (add-flow + fuzzy search). Also tsx, and for the same reason:
      # it drives the REAL lib/catalogSearch.ts and lib/catalogWrite.ts rather
      # than reconstructed SQL.
      #
      # § 1 asserts the QUERY PLAN, which is the only way to catch the phase's
      # highest-risk regression: every wrong spelling of the trigram predicate
      # returns the CORRECT ROWS and merely loses the index, so it is invisible
      # to a results-based test. Verified by mutation testing — the three wrong
      # forms each fail this suite, and each one passed an earlier version that
      # explained a hand-written copy of the query instead of the shared
      # predicate builder.
      - name: Catalog add-flow and search
        run: npx tsx scripts/tests/catalog-addflow-integration.mjs
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379

    services:
      # The add-flow suite drives lib/session.ts's real Redis→Postgres wine
      # writers (pgUpsertWine / pgReassignWineProvenance) and addWineToSession.
      # Importing that module connects to Redis eagerly, so the suite needs one.
      # An earlier version of the suite worked around its absence by reading the
      # writers' SOURCE for the expected field names — which review showed was
      # too weak: it checks names, not values, so writing `vintageId` from
      # `wine.productId` (a composite-FK violation at runtime) passed green. A
      # service block is cheaper than a weaker assertion.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
