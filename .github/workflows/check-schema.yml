name: Schema vs migrations in sync

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a new commit lands on the same ref.
concurrency:
  group: schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # 🔒 Prisma does NOT wrap migration SQL in a transaction — measured: a file
      # whose third statement fails leaves the first two COMMITTED. So a
      # multi-statement migration without BEGIN/COMMIT can leave a half-applied
      # schema, and the step below (which proves the chain applies cleanly on a
      # fresh database) says nothing about failure atomicity.
      #
      # ⚠️ Runs FIRST and needs no database: it is a static read of the migration
      # files, and a non-atomic migration should be caught before anything is
      # applied anywhere.
      - name: Migrations are transactional
        run: node scripts/check-migration-transactions.mjs

      # Compare the committed migrations directory against schema.prisma.
      # `--exit-code` makes Prisma return 2 when they differ — meaning someone
      # changed the schema without running `prisma migrate dev` to generate
      # the matching migration file. Catches the failure mode where the app
      # runs fine locally (via `db push`) but breaks on Deploio because the
      # migration file is missing.
      #
      # `--from-migrations` requires a shadow database: Prisma applies the
      # migration SQL to it, reads the resulting schema, and diffs that
      # against schema.prisma. Prisma 7 dropped the `--shadow-database-url`
      # flag; the URL reaches the CLI through SHADOW_DATABASE_URL →
      # prisma.config.ts `datasource.shadowDatabaseUrl`. `--to-schema` is the
      # 7 spelling of `--to-schema-datamodel` (the FILE, not a database — the
      # other v7 destination, `--to-config-datasource`, would introspect a
      # live database and change what this gate means).
      - name: Check schema and migrations are in sync
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
        env:
          SHADOW_DATABASE_URL: postgres://prisma:prisma@localhost:5432/shadow

      # The diff above cannot see CHECK bodies, deferred constraint triggers,
      # partial uniqueness, NULLS NOT DISTINCT, audit immutability, or
      # concurrency behaviour — Prisma ignores objects it can't model. So a
      # regression that narrows the wine-catalog lead trigger, drops a NOT NULL,
      # or removes the last-admin guard would pass the drift check silently.
      # These suites apply the real migration chain and assert the invariants.
      #
      # A DEDICATED, DISPOSABLE database — deliberately NOT Prisma's `shadow`
      # DB, which Prisma treats as its own scratch space (it drops and recreates
      # objects there while computing diffs, so sharing it would let the two
      # stomp on each other).
      # Required: the suites import @prisma/client, and this repo's postinstall
      # only runs patch-package — it does NOT generate the client.
      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Create the integration-test database
        run: psql "postgres://prisma:prisma@localhost:5432/postgres" -c 'CREATE DATABASE catalog_test'
        env:
          PGPASSWORD: prisma

      - name: Apply the full migration chain
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test

      # The shapes of the five catalog tables are a VERSIONED IMPORT CONTRACT,
      # and CHECK PREDICATES ARE PART OF THAT SHAPE (RFC § Catalog write
      # ownership). `20260725220000` changed four of them from `btrim(x) <> ''`
      # to `catalog_fold_v1(x) <> ''` — strictly stronger, so rows that were
      # insertable stopped being insertable — with no surface and no version
      # bump, because neither side had tooling that would notice.
      #
      # 🔒 Runs BEFORE the row-writing suites: it reads schema only, so a
      # contract drift should fail fast rather than after several minutes of
      # integration tests.
      - name: Catalog contract CHECK constraints
        run: node scripts/check-catalog-contract-checks.mjs
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test

      # The FK pin (wine-catalog-model-change.md § 5a): every foreign key INTO the
      # five catalogue tables is ON DELETE NO ACTION, except the ruled CASCADE on
      # product_producers.product_id. Found from pg_constraint by target, so a
      # table that links into the catalogue later is covered the day it lands.
      # A purge or the catalogue's replace mode then FAILS on a reference it
      # forgot instead of deleting or clearing user history. Negative control:
      # catalog-schema-integration.mjs § 22.
      - name: Catalog inbound foreign keys are NO ACTION
        run: node scripts/check-catalog-inbound-fks.mjs
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test

      # The session record's CHECK predicates (redis-rehydration § 4.3:
      # `ratings_session_rater_known` — account deletion is structured around
      # it). Same blind spot as above, same remedy: a committed snapshot.
      - name: Session-record CHECK constraints
        run: node scripts/check-session-record-checks.mjs
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test

      # Needs `psql` on PATH: § 18 executes the prisma/CLAUDE.md bootstrap recipes
      # VERBATIM (they are documented as psql scripts with BEGIN;/COMMIT;, which
      # Prisma's executeRaw cannot accept). ubuntu-latest ships psql, and the
      # "Create the integration-test database" step above already relies on it.
      - name: Catalog schema invariants
        run: node scripts/tests/catalog-schema-integration.mjs
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test

      # Run via tsx: this suite imports lib/staffRole.ts so it exercises the
      # REAL revokeStaffRoleAs and its advisory lock. A raw `DELETE FROM
      # staff_roles` would test only the DB trigger and would report the
      # cross-path race as covered while never touching the app path.
      - name: Last-admin concurrency
        run: npx tsx scripts/tests/staff-role-concurrency.mjs
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test

      # Phase 2 (add-flow + fuzzy search). Also tsx, and for the same reason:
      # it drives the REAL lib/catalogSearch.ts and lib/catalogWrite.ts rather
      # than reconstructed SQL.
      #
      # § 1 asserts the QUERY PLAN, which is the only way to catch the phase's
      # highest-risk regression: every wrong spelling of the trigram predicate
      # returns the CORRECT ROWS and merely loses the index, so it is invisible
      # to a results-based test. Verified by mutation testing — the three wrong
      # forms each fail this suite, and each one passed an earlier version that
      # explained a hand-written copy of the query instead of the shared
      # predicate builder.
      - name: Catalog add-flow and search
        run: npx tsx scripts/tests/catalog-addflow-integration.mjs
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379

      # The every-word bottle search (catalogue model change step 7b): the one
      # field's matching, the tiers under saturation, merges resolved at read
      # time, the writers keeping the search docs current (paused schedules for
      # the row rule), the rebuild's drift report, plans on a 30k fixture and
      # statement counts. Seeds and deletes its own marked rows; runs the rebuild.
      - name: Catalogue bottle search (catalogue model change step 7b)
        run: npx tsx scripts/tests/catalog-bottle-search.mts
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379

      # Native session lifetime (lib/betterAuth.ts expiresIn/updateAge + hooks,
      # lib/resolveUser.ts disableRefresh, identityStore revoke + prune). Drives the
      # REAL Better Auth instance over both stores: sign-in stamps 365d, the
      # server-side resolveUser seam never slides, the HTTP heartbeat slides
      # AND re-issues the cookie (the only way the device learns the new
      # expiry), expired rows die on access, the chokepoint prune retires only
      # rows past the margin (incl. a Redis copy ahead of its row), and the
      # native revokes (/revoke-sessions, /revoke-other-sessions,
      # /change-password) reach both stores even with BA's active-sessions
      # list evicted — including under injected snapshot / per-token / post-
      # commit failures; resolveUser bumps the app's last-seen once per 5-min
      # bucket (updatedAt only, both stores, no resurrection on a racing
      # revoke, never failing or delaying the request). Mutation-tested:
      # reverting any of the fixes fails the matching section. AUTH_SECRET is
      # any string — BA signs the cookie with it and verifies in-process.
      - name: Native session lifetime
        run: npx tsx scripts/tests/ba-session-lifetime.mjs
        timeout-minutes: 5
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-only-ba-session-lifetime-secret

      # The Prisma session time zone is pinned to UTC (lib/pgSession.mjs).
      # Production Postgres defaults to Europe/Zurich and @prisma/adapter-pg
      # assumes UTC; every other suite runs on a UTC database and cannot see a
      # regression. This one gets a database whose DEFAULT zone is
      # Europe/Zurich (the suite refuses to run otherwise).
      - name: Create the time-zone test database (default zone Europe/Zurich)
        run: |
          psql "postgres://prisma:prisma@localhost:5432/postgres" -c 'CREATE DATABASE tz_test'
          psql "postgres://prisma:prisma@localhost:5432/postgres" -c "ALTER DATABASE tz_test SET timezone TO 'Europe/Zurich'"
        env:
          PGPASSWORD: prisma

      - name: Apply the migration chain to the time-zone database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/tz_test

      - name: Prisma session time zone is UTC
        run: npx tsx scripts/tests/pg-timezone-integration.mjs
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/tz_test

      # Redis rehydration release A (docs/dev/proposals/redis-rehydration.md
      # § 9 "additive release", kept green on release B's tree — its mechanism
      # assertions were moved to B's): mirrors, the mirror token, tombstones, the
      # one-transaction account deletion incl. worker-kill and Redis-unreachable
      # schedules, the old-writer compatibility case and the delete registry.
      # Real route handlers + lib against this Postgres + the throwaway Redis.
      - name: Redis rehydration — release A (additive)
        run: npx tsx scripts/tests/redis-rehydration-additive.mts
        timeout-minutes: 10
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-only-redis-rehydration-suite-secret-0123456789

      # Release B ("cutover", redis-rehydration § 9 + the release-B plan § 12):
      # the rebuild round trip, record-grants / cache-denies, NX/XX, the B1/B2
      # schedules (pause hooks + "assert B blocked"), deletion races and worker
      # kills, fencing, the publication generation vs zombie rebuilds, eviction
      # belts, the D1 blind crash, code recycling and the CHECK + B's migration
      # body. Runs on the same database after the additive suite.
      - name: Redis rehydration — release B (cutover)
        run: npx tsx scripts/tests/redis-rehydration-cutover.mts
        timeout-minutes: 15
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-only-redis-rehydration-suite-secret-0123456789

      # Catalogue model change step 3 (docs/dev/proposals/wine-catalog-model-change.md
      # § 8a): record-first bottle writes in a Postgres-backed moment, the line-up
      # revision (bump, stamp, compare on read: behind / ahead / unstamped), NULL
      # = not reconciled (cache-only bottles copied in, record-only rows
      # orphaned), client ids + insert-only create + the identity-free answer,
      # the image call (Redis-only refused, a failed write reclaims its upload),
      # check-in replay, a failed write / rollback / lost projection / kill
      # between COMMIT and projection, every writer bumps, the scrubs, the
      # promotion race, the old-tab 409, the build id, the census gate, and the
      # PREVIOUS release's mirror (copied from main) over a new-projected line-up.
      - name: Occurrence persistence (catalogue model change step 3)
        run: npx tsx scripts/tests/occurrence-persistence.mts
        timeout-minutes: 10
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-only-occurrence-persistence-secret-0123456789

      # Catalogue model change step 4: every new bottle links (pick, or create
      # signed in only: one fixed refusal for a guest), the snapshot from the
      # entry, the line-up's `entry` key and its blind redaction (no entry, no
      # abv; colour / sparkling stay), merges resolved on every read, the
      # moment's own search for guests (its budget, a spent wrong-code budget),
      # the vintage lookup, the review item on every user mint (rolled back with
      # it), the gate open by default ('false' the kill switch), badges from the
      # snapshot, and the interleaved concurrent PATCH (release condition 6: two
      # real overlapping requests through mutationHooks).
      - name: Catalogue on every write (catalogue model change step 4)
        run: npx tsx scripts/tests/catalog-every-write.mts
        timeout-minutes: 10
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-only-catalog-every-write-secret-0123456789

      # Catalogue model change step 5: cravings. One per (user, wine, vintage)
      # with its first source and stored moment; hidden while that source is
      # hidden for its owner (lists, counts, badges, the saved flag); a save of
      # a bottle hidden for you saves that bottle (blind_saves, ruled
      # 2026-11-20); re-point = a fresh craving; a deleted bottle's visible
      # craving keeps its moment; a re-link carries the cravings; the feed and
      # the line-up's per-viewer `saved`; Saved as one wine with its vintages;
      # merges followed on every match; D8 in one helper; the purge's clearing.
      - name: Catalogue cravings (catalogue model change step 5)
        run: npx tsx scripts/tests/catalog-cravings.mts
        timeout-minutes: 10
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-only-catalog-cravings-secret-0123456789

      # You profile step 2 (.local plan § Verification): bio normalisation +
      # PATCH /api/me/profile, the tile pools and pins (D3 re-hide, D7, the
      # dead-pin clear vs a same-URL re-pick on the locked row), the D8 / D9
      # wine-photo retention on moment and account deletion (incl. a rolled-back
      # attempt), and the profile image replace protocol; step 3: the mute
      # list (blocked-me scrub, cap), the devices routes for an app caller
      # (This Device, own-row revoke, revoke-all keeps the caller) and the
      # Delete Account failure premise (a refused deletion has already signed
      # the phones out). S3 is an in-process fake endpoint that records the
      # SDK's PUT / DELETE requests.
      #
      # § 18 public user ids (docs/dev/proposals/public-user-ids.md § 9): the
      # wire walk, every input route refusing the integer, the null paths,
      # auth through the native route module, the schema triggers + CHECKs, the
      # sealed people cursor, tile ownership by row, the re-key script, and the
      # CANARY: every fixture user is minted at ≥ 900000000 and every response
      # of the run is scanned raw for a user integer / u:<digit>.
      #
      # § 21 usernames (docs/dev/proposals/usernames.md § 12,
      # scripts/tests/usernames-section.mts): the format CHECK against the core
      # validator, the hold triggers (rename, deletion, expiry), the rename
      # quota, the races on two connections with their negative controls (a
      # BEFORE trigger, a missing row lock), honest one-step sign-up (app and
      # web), by-username = the id route, `username` on every person outside a
      # moment and never inside one, search, the limits, the writes census.
      #
      # § 23 Moment Visibility, step 1a (docs/dev/proposals/moment-visibility.md,
      # scripts/tests/moment-visibility-section.mts): sessions.public_id and the
      # three triggers migrate diff cannot see, a real create's defaults, a
      # promotion landing closed, the visibility GET / PATCH and the look-in
      # link (the flag after the entrance gate, the freeze, the secret failing
      # closed, the version only going up), the scrub gate on both delete
      # paths (a tombstone keeps id, deleted_at, public_id), the migration's
      # two one-off statements run verbatim through psql on fixture rows
      # (psql is on ubuntu-latest, as the catalog suite relies on), guests'
      # `shown`, blind rows without a wine id.
      # § 24 Moment Visibility, step 1b (scripts/tests/moment-lookin-section.mts):
      # who is named and who may look in against the single-profile gate, the
      # look-in's one 404 and its limiter before any lookup, the leak matrix,
      # the guest reader bound to the incarnation, the by-moment read, open
      # rows on someone's Moments and their filters, the tile, the feed's
      # momentId and hostName, the code / link-token canary.
      # § 26 Moment Visibility, step 3b (scripts/tests/private-moment-section.mts):
      # "Private Moment", a moment's name outside it only to a viewer who
      # could open it (feed, web profile, someone's Impressions and its q, own
      # Cravings), decideAdmission against decideMoments, one candidate set
      # whatever q says, the top-up, the Incognito race, a throwing decision.
      - name: You profile (tiles, retention, profile images, settings, public ids, moment visibility)
        run: npx tsx scripts/tests/you-profile-integration.mts
        timeout-minutes: 12
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-only-you-profile-suite-secret-0123456789

      # Public user ids, the web half: the proxy (version floor on every /api
      # call, the old-tab bounce by DECODED token under both cookie names and
      # chunked forms, the NEXTAUTH_SECRET-only deploy) and the NextAuth
      # /api/auth/session wrapper (the public id, no userSessionId).
      - name: Public ids (proxy + NextAuth session)
        run: npx tsx scripts/tests/public-ids-web.mts
        timeout-minutes: 3
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-only-public-ids-web-secret-0123456789

      # Usernames, the web half: `/@<name>` and the encoded `/%40<name>` are
      # next.config.ts REWRITES (an `@folder` is a parallel-routes slot), which
      # run in the router in front of every page, so no route-module test sees
      # them. This builds the app and drives the server the image runs
      # (`node .next/standalone/server.js`): both forms open the profile, an
      # operator-assigned reserved name too, everything malformed / unknown /
      # renamed away is a 404, and with the limiter spent neither page entry
      # touches `users`. The build needs no database or secret (the image's
      # builder stage has none either).
      # AUTH_SECRET only quiets Better Auth's "default secret" log line while
      # Next collects page data; the build passes without it.
      - name: Build the web app
        run: npm run build
        env:
          AUTH_SECRET: ci-only-usernames-web-secret-0123456789

      - name: Usernames (the /@name rewrite against the built server)
        run: npx tsx scripts/tests/usernames-web.mts
        timeout-minutes: 5
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-only-usernames-web-secret-0123456789

      # Moment Visibility step 2: the look-in link's page (`/l/<id>.<token>`)
      # against the BUILT server: its headers come from next.config.ts (a later
      # `headers()` entry overriding the site-wide Referrer-Policy), no
      # route-module test can see them. Flag on: no-referrer, no-store,
      # noindex, the "Open in Verre" href exactly `io.verre.app://l/<link>`, no
      # other-origin URL, no Set-Cookie; malformed: no button; flag off: 404.
      - name: Moment Visibility (the /l/ page against the built server)
        run: npx tsx scripts/tests/moment-link-web.mts
        timeout-minutes: 5
        env:
          DATABASE_URL: postgres://prisma:prisma@localhost:5432/catalog_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-only-moment-link-web-secret-0123456789

    services:
      # The add-flow suite drives lib/session.ts's real Redis→Postgres wine
      # writers (mirrorLineup / reassignProvenance) and addWineToSession.
      # Importing that module connects to Redis eagerly, so the suite needs one.
      # An earlier version of the suite worked around its absence by reading the
      # writers' SOURCE for the expected field names — which review showed was
      # too weak: it checks names, not values, so writing `vintageId` from
      # `wine.productId` (a composite-FK violation at runtime) passed green. A
      # service block is cheaper than a weaker assertion.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
