name: Flavour palette vendor chokepoint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flavour-palette-vendor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Fail the build if the vendored native flavour palette
      # (apps/mobile/src/theme/flavourColors.ts) drifts from the tracked full
      # palette (apps/mobile/src/theme/flavour-palette/palette.js). The colours
      # live in three copies by design (design source + full tracked copy +
      # vendored runtime subset); a silent drift = wrong wedge colours with
      # nothing to catch it. Safe-by-construction, not safe-by-discipline. See
      # apps/mobile/src/theme/flavour-palette/CLAUDE.md.
      #
      # No npm ci needed — a dependency-free Node script that reads tracked files
      # via `git ls-files`.
      - name: Check vendored flavour colours match the full palette
        run: node scripts/check-flavour-palette-vendor.mjs
